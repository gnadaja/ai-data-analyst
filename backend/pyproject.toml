[project]
name = "ai-data-analyst-api"
version = "0.1.0"
description = "Secure data analysis API for AI Data Analyst"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "pydantic-settings>=2.6,<3.0",
    "uvicorn[standard]>=0.34,<1.0",
    "pandas>=2.2,<3.0",
    "numpy>=2.0,<3.0",
    "openpyxl>=3.1,<4.0",
    "python-multipart>=0.0.20,<1.0",
    "supabase>=2.15,<3.0",
    "xlrd>=2.0,<3.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28,<1.0",
    "pytest>=8.3,<9.0",
    "ruff>=0.9,<1.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
